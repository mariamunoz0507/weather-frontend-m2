<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Actividad 6 - jQuery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container mt-5">

    <h2>Lista de Elementos</h2>
    <ul id="miLista">
        <li>Elemento 1</li>
        <li>Elemento 2</li>
        <li>Elemento 3</li>
    </ul>

    <button id="btnAccion" class="btn btn-primary">Ocultar lista</button>

    <hr>

    <h3>Ejemplo de Plugin (Modal)</h3>
    <button type="button" class="btn btn-success" data-bs-toggle="modal" data-bs-target="#miModal">
        Abrir Modal
    </button>

    <div class="modal fade" id="miModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">¡Plugin Funcionando!</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">Este es un componente modal de Bootstrap.</div>
            </div>
        </div>
    </div>

    <script>
        $(document).ready(function(){
            // 3. Manipulación del DOM
            // Cambiar color de texto [cite: 25]
            $("#miLista li").css("color", "blue");
            // Agregar cuarto elemento dinámicamente [cite: 26]
            $("#miLista").append("<li>Elemento 4 (Agregado con jQuery)</li>");

            // 4. Eventos [cite: 33, 34]
            $("#btnAccion").click(function(){
                $("#miLista").toggle(); // Oculta o muestra
                
                // Cambiar el texto del botón según el estado de la lista
                if ($("#miLista").is(":visible")) {
                    $(this).text("Ocultar lista");
                } else {
                    $(this).text("Mostrar lista");
                }
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
